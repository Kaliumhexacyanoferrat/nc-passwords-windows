name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0). Used as the git tag and release title."
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NcPasswords.slnx

      - name: Test
        run: dotnet test tests/NcPasswords.Core.Tests/NcPasswords.Core.Tests.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/NcPasswords.App/NcPasswords.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish
          -p:Version=${{ inputs.version }}

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath NcPasswords-${{ inputs.version }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create v${{ inputs.version }}
          NcPasswords-${{ inputs.version }}-win-x64.zip
          --title "v${{ inputs.version }}"
          --generate-notes
