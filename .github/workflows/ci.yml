name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NcPasswords.slnx

      - name: Test
        run: dotnet test tests/NcPasswords.Core.Tests/NcPasswords.Core.Tests.csproj -c Release --no-restore
